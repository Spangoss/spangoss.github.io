<!doctype html>
<html lang="en" data-bs-theme="" class="h-100" ng-app="tradeSkills" ng-controller="tradeSkillsCtrl">

<head>
    <meta charset="utf-8">
    <meta name='viewport' content='width=device-width, maximum-scale=1.0, minimum-scale=1.0, initial-scale=1.0' />
    <meta name=" apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="">
    <!-- Metadata -->
    <title>World of Warcraft Forever: Tradeskills</title>
    <meta name="description" content="Spangoss Fandango's Enchanting Emporium.">
    <meta name="keywords" content="wow, world of warcraft, forever, enchanting, profession">
    <link rel="canonical" href="https://spangoss.net/" />
    <!-- Icons -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png"><!-- 180×180 -->
    <!-- Manifest -->
    <link rel="manifest" href="site.webmanifest">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS-->
    <link rel="stylesheet" href="styles/main.css">
    <!-- Bootstrap Javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Angular JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"
        integrity="sha512-KZmyTq3PLx9EZl0RHShHQuXtrvdJ+m35tuOiwlcZfs/rE7NZv29ygNA8SFCkMXTnYZQK2OX0Gm2qKGfvWEtRXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Custom Scripts-->
    <script src="scripts/color-mode-toggler.js"></script>
    <script src="scripts/rainbow-text.js"></script>
    <script src="scripts/wow-forever-tradeskills.js"></script>
    <!-- Warcraft Database -->
    <script>const wdbTooltipConfig = {
            renameLinks: true, // replace empty or raw-url link text with the real name
            colorLinks: true, // add a quality colour class to the link
            iconizeLinks: false, // insert an icon before the link text
            iconSize: 'small', // 'small', 'medium' or 'large'
            lazyLoading: false, // true = hover tooltips only, no link decoration
            parseUrl: '' // extra domain to scan for links, besides this site
        };</script>
    <link rel="stylesheet" href="https://forever.warcraftdb.com/static/css/tooltip.css">
    <script src="https://forever.warcraftdb.com/static/js/tooltip-embed.js"></script>

</head>

<body class="d-flex flex-column h-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg mb-3 mt-lg-4">
        <div class="container-lg container-fluid-md">
            <a class="navbar-brand logo ff-ubuntu" href="index.html">{mb}</a>
            <div class="form-check form-switch mode-switch order-lg-2 ms-auto" data-bs-toggle="mode">
                <input class="form-check-input" type="checkbox" role="switch">
                <label class="form-check-label" for="flexSwitchCheckDefault"></label>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse text-end" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-3">
                        <a class="nav-link" href="about.html">ABOUT</a>
                    </li>
                    <!--<li class="nav-item me-3">
                        <a class="nav-link active" href="art.html">ART</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="music.html">MUSIC</a>
                    </li>-->
                </ul>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="container-lg container-fluid-md mb-3">
        <div class="row">
            <div class="col">
                <h1><img src="images/wow-forever-icon.png" alt="Logo" width="50"
                        class="d-inline-block align-text-top me-2">World of Warcraft Forever Professions</h1>
                <p>Here are some recipes that I can make in World of Warcraft Forever.</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <!-- Tabs -->
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="enchanting-tab" data-bs-toggle="tab"
                            data-bs-target="#enchanting-tab-pane" type="button" role="tab"
                            aria-controls="enchanting-tab-pane" aria-selected="true">Enchanting</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tailoring-tab" data-bs-toggle="tab"
                            data-bs-target="#tailoring-tab-pane" type="button" role="tab"
                            aria-controls="profile-tab-pane" aria-selected="false">Tailoring</button>
                    </li>
                </ul>
                <!-- Tab Content -->
                <div class="tab-content" id="tabContent">
                    <!-- Enchanting Tab -->
                    <div class="tab-pane show active" id="enchanting-tab-pane" role="tabpanel"
                        aria-labelledby="enchanting-tab" tabindex="0">
                        <ul class="list-group">
                            <li class="list-group-item">
                                <div class="row my-2">
                                    <div class="col-6">
                                        <form class="form-field" role="search">
                                            <input class="form-control" type="search" ng-model="enchantingSearchTerm"
                                                placeholder="Search..." aria-label="Search" />
                                        </form>
                                    </div>
                                    <div class="col-6">
                                        <select class="form-select" ng-model="selectedEnchantingCategory"
                                            aria-label="Category Select">
                                            <option selected value=""">Select Category</option>
                                            <option ng-repeat=" item in enchantingCategories" value="{{item.name}}">
                                                {{item.name}}</option>
                                        </select>
                                    </div>
                                </div>
                            </li>
                            <li ng-repeat="item in enchantingRecipies | filter: enchantingSearchTerm | filter:{category: selectedEnchantingCategory}"
                                class="list-group-item"><a href="https://forever.warcraftdb.com/data/spell/{{item.id}}"
                                    target="_blank"></a>
                            </li>
                        </ul>
                    </div>
                    <!-- Tailoring Tab -->
                    <div class="tab-pane" id="tailoring-tab-pane" role="tabpanel" aria-labelledby="tailoring-tab"
                        tabindex="0">
                        <ul class="list-group">
                            <li class="list-group-item">
                                <div class="row my-2">
                                    <div class="col-6">
                                        <form class="form-field" role="search">
                                            <input class="form-control" type="search" ng-model="tailorinfgSearchTerm"
                                                placeholder="Search..." aria-label="Search" />
                                        </form>
                                    </div>
                                    <div class="col-6">
                                        <select class="form-select" ng-model="selectedTailoringCategory"
                                            aria-label="Category Select">
                                            <option selected value=""">Select Category</option>
                                                                <option ng-repeat=" item in tailoringCategories"
                                                value="{{item.name}}">
                                                {{item.name}}</option>
                                        </select>
                                    </div>
                                </div>
                            </li>
                            <li ng-repeat="item in tailoringRecipies | filter: tailoringSearchTerm | filter:{category: selectedTailoringCategory}"
                                class="list-group-item"><a href="https://forever.warcraftdb.com/data/item/{{item.id}}"
                                    target="_blank"></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer-->
    <footer class="mt-auto">
        <p class="text-center text-secondary">
            <small>
                <i class="bi bi-code-square me-2"></i>
                Code by Mark Branscombe | &copy; 2026
            </small>
        </p>
    </footer>
</body>

</html>
